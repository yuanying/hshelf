name: Image

# Every run runs the tests in the image and builds it. A tag publishes a
# release: v1.0.0 is pushed as 1.0.0, 1.0 and latest. A push to main publishes
# main, which the vulnerability tracker scans to tell a fix that is on main
# from one that is already released.
#
# release.yaml calls this with the version it is about to tag. A tag pushed with
# the run's GITHUB_TOKEN starts no workflow, so the release's image is pushed
# here first, from the commit about to be tagged, and the tag only follows once
# it exists. It is pushed under the same names as a tag pushed by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: The version release.yaml is about to tag (vX.Y.Z).
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The image runs on the workers of fraction, which are all amd64.
  # The arm64 machines there are control planes and take no workloads.
  PLATFORMS: linux/amd64

jobs:
  # Runs for every event, a pull request included, and can write nothing: a
  # pull request from a Renovate branch is one the repository's own token
  # would otherwise be able to push packages from.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The test stage shares its layers with the image, so the build after it
      # only adds the last stage. The cache carries those layers to publish.
      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A version tag, a call from release.yaml, or a push to main. A call
      # runs under the caller's event, a schedule or a dispatch, never a push.
      - id: publish
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        run: echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The labels carry org.opencontainers.image.source and
      # org.opencontainers.image.revision, which the vulnerability tracker
      # reads to find the repository and the commit of an image. The version
      # comes from the pushed tag, or from release.yaml's input when called.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
            type=raw,value=main,enable=${{ inputs.version == '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The cache holds the layers built above, so this only pushes.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Each push to main moves main to a new image and leaves the old one
  # untagged. This deletes the untagged images, and never a tagged one. The
  # action deletes an image together with its platform images and
  # attestations, so it does not break a multi-platform image the way deleting
  # untagged versions one by one would. A call from release.yaml never runs it:
  # a release untags nothing.
  cleanup:
    needs: publish
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    # The action is not safe to run twice at once on the same package.
    concurrency:
      group: ghcr-cleanup
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          # Logs any multi-platform image left with missing platform images.
          validate: true
