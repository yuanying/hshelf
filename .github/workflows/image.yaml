name: Image

# Every run runs the tests in the image and builds it. A tag publishes a
# release: v1.0.0 is pushed as 1.0.0, 1.0 and latest. A push to main publishes
# main, which the vulnerability tracker scans to tell a fix that is on main
# from one that is already released.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The image runs on the workers of fraction, which are all amd64.
  # The arm64 machines there are control planes and take no workloads.
  PLATFORMS: linux/amd64
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The labels carry org.opencontainers.image.source and
      # org.opencontainers.image.revision, which the vulnerability tracker
      # reads to find the repository and the commit of an image.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
      # The test stage shares its layers with the image, so the build after it
      # only adds the last stage.
      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          target: test
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The builder still holds the layers of the build above, so this only pushes.
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Each push to main moves main to a new image and leaves the old one
  # untagged. This deletes the untagged images, and never a tagged one. The
  # action deletes an image together with its platform images and
  # attestations, so it does not break a multi-platform image the way deleting
  # untagged versions one by one would.
  cleanup:
    needs: image
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    # The action is not safe to run twice at once on the same package.
    concurrency:
      group: ghcr-cleanup
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          # Logs any multi-platform image left with missing platform images.
          validate: true
